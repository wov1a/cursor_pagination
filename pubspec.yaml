name: cursor_pagination
description: A flexible cursor-based pagination library for Flutter with full generic type support. Works with ChangeNotifier, BLoC/Cubit, and supports any cursor type.
version: 1.0.1
repository: https://github.com/wov1a/cursor_pagination
homepage: https://github.com/wov1a/cursor_pagination
documentation: https://github.com/wov1a/cursor_pagination#readme

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: '>=8.0.0 <10.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
  test: ^1.25.6

# Topics for pub.dev discoverability
topics:
  - pagination
  - cursor
  - infinite-scroll
  - flutter
  - bloc
